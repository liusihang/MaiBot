name: Pi Harness Tests
on:
  pull_request:
    paths:
      - "runtime/pi_agent/**"
      - "src/maisaka/pi_runtime/**"
      - "src/maisaka/participation.py"
      - "src/maisaka/reasoning_engine.py"
      - "src/maisaka/builtin_tool/reply.py"
      - "src/maisaka/builtin_tool/query_emoji.py"
      - "src/maisaka/builtin_tool/send_emoji.py"
      - "src/maisaka/builtin_tool/context.py"
      - "src/maisaka/builtin_tool/__init__.py"
      - "src/maisaka/runtime.py"
      - "src/learners/**"
      - "src/chat/replyer/expression_vector_index.py"
      - "src/services/emoji_retrieval.py"
      - "src/services/group_expression_*.py"
      - "src/maisaka/builtin_tool/query_group_expressions.py"
      - "src/emoji_system/maisaka_tool.py"
      - "src/services/pi_harness/**"
      - "src/services/daily_topics/**"
      - "prompts/**/daily_topics*"
      - "prompts/**/participation_judge.prompt"
      - "prompts/**/learn_joint.prompt"
      - "prompts/**/expression_batch_review.prompt"
      - "pytests/services/test_daily_topic*.py"
      - "pytests/maisaka/test_pi_*.py"
      - "pytests/maisaka/test_single_agent_reply.py"
      - "pytests/maisaka/test_participation.py"
      - "pytests/maisaka/test_joint_learning.py"
      - "pytests/maisaka/test_group_expression_*.py"
      - "pytests/maisaka/test_emoji*.py"
      - "pytests/plugin_runtime/test_emoji_reply_target.py"
      - "pytests/services/test_pi_harness_bridge.py"
      - ".github/workflows/pi-harness-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install pinned Pi SDK
        run: npm --prefix runtime/pi_agent ci --ignore-scripts --no-audit --no-fund
      - name: Real SDK with mock provider wires
        run: npm --prefix runtime/pi_agent test
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python test dependencies
        run: uv sync --group dev
      - name: Business bridge and legacy-network rejection tests
        env:
          PYTHONPATH: .
        run: >-
          uv run pytest -q
          pytests/maisaka/test_pi_business_store.py
          pytests/maisaka/test_pi_harness_host.py
          pytests/maisaka/test_pi_subagents.py
          pytests/maisaka/test_pi_evidence.py
          pytests/maisaka/test_pi_observer.py
          pytests/maisaka/test_pi_observer_integration.py
          pytests/maisaka/test_single_agent_reply.py
          pytests/maisaka/test_participation.py
          pytests/services/test_pi_harness_bridge.py
          pytests/services/test_daily_topics.py
          pytests/services/test_daily_topic_service.py
          pytests/maisaka/test_pi_daily_topics.py
          pytests/maisaka/test_pi_references.py
          pytests/maisaka/test_pi_expression_references.py
          pytests/maisaka/test_pi_expression_small_index.py
          pytests/maisaka/test_joint_learning.py
          pytests/maisaka/test_emoji_retrieval.py
          pytests/maisaka/test_emoji_store.py
          pytests/maisaka/test_show_emoji_persistence.py
          pytests/plugin_runtime/test_emoji_reply_target.py
          pytests/maisaka/test_group_expression_catalog.py
          pytests/maisaka/test_group_expression_search.py
          pytests/maisaka/test_group_expression_tool.py
