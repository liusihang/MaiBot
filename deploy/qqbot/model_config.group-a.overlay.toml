# QQ group deployment profile, revision 2.
[model_task_config.replyer]
model_list = ["gpt-6.1-terra"]
max_tokens = 8024
temperature = 1.4
selection_strategy = "random"
hard_timeout = 150

[model_task_config.planner]
model_list = ["group-chat-deepseek"]
max_tokens = 25600
temperature = 1.4
selection_strategy = "random"
hard_timeout = 150

# Use a separate key bound to the Tongji group. Keep codex-provider for Luna
# and other existing tasks; do not move their shared key to another group.
[[api_providers]]
name = "tongji-campus"
base_url = "https://gateway.example.com/v1"
api_key = ""
client_type = "openai"
auth_type = "bearer"
timeout = 150
max_retry = 0

[[models]]
name = "group-chat-deepseek"
model_identifier = "DeepSeek-V4.1-Flash"
api_provider = "tongji-campus"
max_tokens = 25600
send_temperature = false
visual = true
extra_params = { reasoning_effort = "max", pi = { thinkingLevelMap = { max = "max" }, compat = { supportsDeveloperRole = false, supportsReasoningEffort = true, thinkingFormat = "deepseek", requiresReasoningContentOnAssistantMessages = true, supportsStore = false } } }
